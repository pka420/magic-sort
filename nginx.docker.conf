server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API — forward to the backend container (compose service name).
    # Also reachable directly via host nginx (sites-enabled/magic-sort
    # proxies /api/ -> 127.0.0.1:8000), but keeping this makes
    # `docker compose up` work standalone without host nginx (local dev).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — everything else serves the game
    location / {
        try_files $uri $uri/ /index.html;
    }
}
