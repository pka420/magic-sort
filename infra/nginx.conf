# nginx server block for magic-sort.from-delhi.net.
#
# Host-level reverse proxy for the Docker deployment. Each site on the VPS
# owns one file in /etc/nginx/sites-available, symlinked into sites-enabled
# via infra/install-nginx.sh. All sites share the host's single nginx
# (see /etc/nginx/nginx.conf: `include sites-enabled/*`).
#
# TLS is terminated by Cloudflare (DNS proxied), so this listens on plain
# HTTP and only ever sees Cloudflare origin fetches. Both app tiers run in
# Docker (docker compose up -d): frontend on 127.0.0.1:3000 (nginx serving the
# Vite build) and backend on 127.0.0.1:8000 (uvicorn/FastAPI). This block
# just proxies to those loopback ports — no `root` on the host.
#
# Docker ports are bound to 127.0.0.1 only (see docker-compose.yml), so the
# containers are not reachable from the public internet except through this
# host nginx.

server {
    listen 80;
    listen [::]:80;
    server_name magic-sort.from-delhi.net;

    # API — FastAPI container
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — nginx container serving the static Vite build.
    # Includes SPA fallback and /assets immutable cache inside the container
    # (see nginx.docker.conf); host just proxies.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
