# nginx server block for magic-sort.from-delhi.net.
#
# One of several blocks sharing the host's single nginx: each site installs its
# own fragment into /etc/nginx/conf.d via infra/install-nginx.sh, which copies
# this file there and reloads nginx. No http{} wrapper here — conf.d is included
# inside nginx's http block.
#
# TLS is terminated by Cloudflare (the DNS record is proxied), so this listens
# on plain HTTP and only ever sees Cloudflare's origin fetches. The game's
# static build lives in /srv/magic-sort/dist, the API in uvicorn on 127.0.0.1:8000.

server {
    listen 80;
    listen [::]:80;
    server_name magic-sort.from-delhi.net;

    root /srv/magic-sort/dist;
    index index.html;

    # Hashed build assets never change, so let the browser keep them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API: every /api/* path goes to uvicorn unchanged, since the backend
    # itself is mounted under /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the single-page game, which owns its own routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
